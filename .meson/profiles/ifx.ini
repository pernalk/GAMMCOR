# gammcor -- production build (Intel ifx)
#
#   meson setup   build --native-file .meson/profiles/ifx.ini -Dtrexio=<prefix>
#   meson compile -C build
#
# Flags follow the Makefile of this branch (ifort -> ifx). MKL is linked with
# -qmkl=parallel (LP64), as in the CMake build (BLAS_VENDOR Intel10_64lp).

[binaries]
fortran = 'ifx'

[built-in options]
fortran_args      = ['-O3', '-g', '-qopenmp', '-assume', 'byterecl', '-heap-arrays', '-warn', 'nounused', '-qmkl=parallel']
fortran_link_args = ['-O3', '-qopenmp', '-qmkl=parallel', '-limf']

[properties]
profile  = 'release'
exe_name = 'gammcor'
