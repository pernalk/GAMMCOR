# Conda environment for building and developing GAMMCOR.
#
#   conda env create -f environment.yml -n <env-name>
#   conda activate <env-name>
#   ./install.sh
#
# <env-name> is any name you choose, e.g. gammcor-dev. Without -n, the env is
# named gammcor-dev (the name: field below).
#
# install.sh sees ifx and MKL in the env and takes everything from it (conda
# mode): -qmkl finds MKL next to ifx, so MKLROOT is not needed (install.sh
# unsets it). Do not load Intel compiler or MKL modules after
# `conda activate`; install.sh stops if ifx, icx or python3 do not come from
# the env. If you set MKLROOT for this env earlier, it can go:
#   conda env config vars unset MKLROOT -n <env-name>
#
# Everything comes from conda-forge. On Linux, conda-forge has no intel-openmp;
# MKL and the Intel Fortran runtime use llvm-openmp instead (pulled in by them).
name: gammcor-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13.15
  - pip=26.2.1
  # Intel oneAPI compilers and MKL. The build number is pinned too: builds of
  # the same version differ in their dependencies (build 331 dropped mpich).
  - ifx_linux-64=2026.1.1=*_331       # Fortran: ifx
  - dpcpp_linux-64=2026.1.1=*_331     # C/C++: icx
  - mkl-devel=2026.1.0
  - llvm-openmp=23.1.4               # OpenMP runtime (libiomp5.so) for ifx -qopenmp
  - gxx_linux-64=16.2.0               # GCC headers and libstdc++ used by icx for XCFun
  # libicaf.so (ifx -coarray=single) links libmpi.so.12, but intel-fortran-rt
  # does not depend on an MPI. Intel MPI, not mpich: conda-forge's mpich links
  # UCX, which prints a CUDA error on every program start on nodes with a CUDA
  # driver but no GPU, and that breaks meson's compiler checks.
  - conda-forge::impi_rt=2021.19.0
  # build tools
  - meson=1.12.1
  - ninja=1.13.2
  - make=4.4.1
  # HDF5 is built by install.sh against these
  - zlib=1.3.2
  - libaec=1.1.5
  # gammcor_tools
  - numpy=2.5.3
  - h5py=3.16.0
  - conda-forge::libcurl              # dependency of h5py's HDF5
  - pyscf=2.14.0                      # optional: only for the PySCF interface
